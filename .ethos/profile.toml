profile_id = "architecture-publications"

[openspec]
material_paths = [
    "**",
]

[proof]
code_correctness_gates = ["input-behavior", "input-static-analysis", "formatting"]

[proof.code_correctness_map]
behavior = "input-behavior"
static-analysis = "input-static-analysis"

[[proof.gates]]
id = "input-behavior"
kind = "test"
providers = ["ethos.adapters.gates.code_quality:behavior_report"]
dimensions = ["behavior", "test", "coverage"]
evidence_class = "proof"
trust_bearing = true
writes_files = true
network_policy = "offline"

[[proof.gates]]
id = "input-static-analysis"
kind = "static"
providers = ["ethos.adapters.gates.code_quality:static_report"]
dimensions = ["static-analysis"]
evidence_class = "proof"
trust_bearing = true
writes_files = false
network_policy = "offline"

[[proof.gates]]
id = "formatting"
kind = "lint"
command = ["prettier", "--config", ".config/checks/prettier.json", "--ignore-path", ".config/checks/prettier.ignore", "--check", "."]
dimensions = ["format"]
evidence_class = "proof"
trust_bearing = true
writes_files = false
network_policy = "offline"
