min_version = "2026.10.14"

[settings]
locked = true
minimum_release_age = "24h"
# Native `mise lock` writes these platforms, the ones ETHOS-governed repositories support.
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64"]

# npm reads this repository's own configuration, which holds npm's release age. npm treats
# environment names case-insensitively, so its lower-case alias is removed.
[env]
npm_config_userconfig = false
NPM_CONFIG_USERCONFIG = "{{ config_root }}/.config/npm/npmrc"

# The repository's common verbs; the npm scripts they call own the commands.
[tasks.bootstrap]
description = "Install the locked npm packages"
run = "npm run bootstrap"

[tasks.check]
description = "Check the formatting and the works' inputs without writing"
run = "npm run check"

[tasks.fix]
description = "Apply the formatters"
run = "npm run fix"

[tools]
node = "26.13.1"

# The ETHOS release declaration as published with v0.2.0-beta.12.
[tools."http:ethos"]
version = "0.2.0-beta.12"

[tools."http:ethos".platforms]
linux-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.12/ethos-0.2.0-beta.12-linux-arm64.tar.gz", checksum = "sha256:b7eb93ada12f82f9c755562429367a5e2792a1a2c96013598382fc08a16c873d", bin_path = "ethos/bin" }
linux-x64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.12/ethos-0.2.0-beta.12-linux-x64.tar.gz", checksum = "sha256:e5e4a390c9a7616067522606160dc0cc63ee8725acd54b30ab3df89b6cf286f0", bin_path = "ethos/bin" }
macos-arm64 = { url = "https://github.com/HengYangDS/ethos/releases/download/v0.2.0-beta.12/ethos-0.2.0-beta.12-macos-arm64.tar.gz", checksum = "sha256:71929b950100188c39a76026e4ff6a6d2d7a35a8fda608483e1e9b2a18729f59", bin_path = "ethos/bin" }
