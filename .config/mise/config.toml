min_version = "2026.10.14"

[settings]
locked = true

# The repository's common verbs; the npm scripts they call own the commands.
[tasks.bootstrap]
description = "Install the locked npm packages"
run = "npm run bootstrap"

[tasks.check]
description = "Check the formatting and the works' inputs without writing"
run = "npm run check"

[tasks.fix]
description = "Apply the formatters"
run = "npm run fix"

[tools]
node = "26.13.0"

# The ETHOS release declaration as published with v0.2.0-beta.10.
[tools."http:ethos"]
version = "0.2.0-beta.10"

